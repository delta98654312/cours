<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <script src="script.js" defer></script>
</head>
  <body>
    <h1>Formulaire d'inscription</h1>
    <form action="https://www.cyrilrabat.fr/test.php" method="post">
        <div class="row mb-3">
            <label for="Email" class="col-sm-2 col-form-label">Email</label>
            <div class="col-sm-4">
                <input type="text" class="form-control" id="Email-Input" value="" name="Email1" required autofocus>
            </div>

            <label for="Telephone" class="col-sm-2 col-form-label">Telephone</label>
            <div class="col-sm-4">
                <input type="tel" class="form-control" id="Telephone-Input" value="" name="Telephone1" required>
            </div>
        </div>
        <div class="row mb-3">
            <label for="Date0" class="col-sm-2 col-form-label">Date de debut</label>
            <div class="col-sm-4">
                <input type="text" class="form-control" id="DateDebutInput" value="" name="DateDebut1" required>
            </div></label>

            <label for="Date1" class="col-sm-2 col-form-label">Date de Fin</label>
            <div class="col-sm-4">
                <input type="text" class="form-control" id="DateFinInput" value="" name="DateFin1" required>
            </div></label>
        </div>

        <label for="Duree" class="col-sm-2 col-form-label">Dure</label>
        <div class="col-sm-10">
            <input type="text" class="form-control-plaintext" id="Duree-Input" value="Date incorect ou non specifie" name="Duree1" readonly>
        </div>










    </form>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
